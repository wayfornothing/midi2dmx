; PlatformIO Project Configuration File
;
; MIDI to DMX Interface - ESP32
; 
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Fréquence CPU optimale pour DMX
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; Partition scheme avec SPIFFS
board_build.partitions = default.csv

; Monitor configuration
monitor_speed = 115200
monitor_filters = 
    colorize
    esp32_exception_decoder

; Upload configuration
upload_speed = 921600
upload_port = AUTO

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0
    ; Optimisations pour performance DMX
    -O2
    ; Support Serial2 (UART2) pour MIDI
    -DARDUINO_USB_CDC_ON_BOOT=0

; Bibliothèques requises
lib_deps = 
    ; MIDI Library by Francois Best
    fortyseveneffects/MIDI Library @ ^5.0.2
    
    ; ArduinoJson by Benoit Blanchon
    bblanchon/ArduinoJson @ ^6.21.4
    
    ; ESP-DMX Library (someweisguy)
    https://github.com/someweisguy/esp_dmx.git

; Exclude examples from libraries
lib_ldf_mode = deep+

; ============================================
; Environnements alternatifs pour tests
; ============================================

[env:esp32dev_debug]
extends = env:esp32dev
build_type = debug
build_flags = 
    ${env:esp32dev.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DDEBUG_ESP_PORT=Serial
monitor_filters = 
    esp32_exception_decoder

[env:esp32doit-devkit-v1]
; ESP32 DevKit V1 30 pins (DOIT)
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
board_build.f_cpu = 240000000L
monitor_speed = 115200
upload_speed = 921600
lib_deps = ${env:esp32dev.lib_deps}
build_flags = ${env:esp32dev.build_flags}

[env:nodemcu-32s]
; NodeMCU-32S
platform = espressif32
board = nodemcu-32s
framework = arduino
board_build.f_cpu = 240000000L
monitor_speed = 115200
upload_speed = 921600
lib_deps = ${env:esp32dev.lib_deps}
build_flags = ${env:esp32dev.build_flags}

[env:lolin32]
; WEMOS LOLIN32
platform = espressif32
board = lolin32
framework = arduino
board_build.f_cpu = 240000000L
monitor_speed = 115200
upload_speed = 921600
lib_deps = ${env:esp32dev.lib_deps}
build_flags = ${env:esp32dev.build_flags}

; ============================================
; Notes de compatibilité
; ============================================
; 
; ESP32 avec Serial2 supporté (UART2):
; ✅ ESP32 DevKit V1 (30 pins) - RECOMMANDÉ
; ✅ ESP32 DOIT DevKit V1
; ✅ NodeMCU-32S
; ✅ WEMOS LOLIN32
; ✅ ESP32-WROVER
; ✅ ESP32-WROOM-32
; 
; ESP32 SANS Serial2 (NE PAS UTILISER):
; ❌ ESP32-S2 (1 seul UART disponible)
; ❌ ESP32-C3 (seulement 2 UARTs, Serial0 et Serial1)
; 
; Brochage UART2 (Serial2) sur ESP32 classique:
; - TX2: GPIO17 (par défaut)
; - RX2: GPIO16 (par défaut)
; Ces pins peuvent être réaffectés si nécessaire.
